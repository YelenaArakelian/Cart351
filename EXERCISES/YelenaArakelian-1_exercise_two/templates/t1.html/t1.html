{% extends "base.html" %} {% block content %}

<h2>🚀 NASA Image Search</h2>

<p>Explore the universe through NASA's image collection!</p>

<!-- Task 2: Search form -->
<form action="{{ url_for('getSearchCriteria') }}" method="GET">
  <label for="search">What would you like to explore?</label>

  <input
    type="text"
    id="search"
    name="search"
    placeholder="Try: Moon, Mars, Earth..."
    required
  />

  <button type="submit">Search</button>
</form>

<!-- Task 2: NASA search results -->
{% if have_results %}

<div class="results">
  <h3>NASA Search Result</h3>

  <img src="{{ imgPath }}" alt="NASA Image" width="500" />

  <p>{{ description }}</p>
</div>

{% endif %} {% endblock %}
