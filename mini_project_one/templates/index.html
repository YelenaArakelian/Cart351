<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Constellations of Strangers</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <!-- Homepage -->
    <main id="home">
      <h1>Constellations of Strangers</h1>

      <p>Somewhere, someone feels the same way you do.</p>

      <button id="leaveStarBtn">Leave a Star</button>

      <button id="exploreSkyBtn">Explore the Sky</button>
    </main>

    <!-- Star letter -->
    <section id="starFormSection" hidden>
      <h2>Leave a Star</h2>

      <p>Share an anonymous thought with the sky.</p>

      <form id="starForm">
        <label for="thought">What's on your mind?</label>

        <textarea
          id="thought"
          name="thought"
          placeholder="Write your thoughts here..."
          maxlength="200"
          required
        ></textarea>

        <label for="emotion">Choose an emotion:</label>

        <select id="emotion" name="emotion" required>
          <option value="">Select an emotion</option>
          <option value="hope">Hope</option>
          <option value="joy">Joy</option>
          <option value="nostalgia">Nostalgia</option>
          <option value="sadness">Sadness</option>
          <option value="loneliness">Loneliness</option>
          <option value="calm">Calm</option>
        </select>

        <button type="submit">Add to the Sky</button>
      </form>

      <button id="backBtn">Back to Home</button>

      <!-- Test collective data display -->
      <div id="savedStars">
        <h3>Stars in Our Sky</h3>
        <ul id="starsList"></ul>
      </div>

      <p id="formMessage" role="status"></p>
    </section>

    <!-- Interactive Sky -->
    <section id="skySection" hidden>
      <header class="sky-header">
        <button id="skyBackBtn">← Home</button>

        <h2>The Collective Sky</h2>

        <button id="skyLeaveBtn">Leave a Star</button>
      </header>

      <p class="sky-description">
        Every star represents a thought left by a stranger. Select a star to
        discover its story.
      </p>

      <!-- Message displayed after submitting a star -->
      <p id="skyMessage" role="status"></p>

      <!-- Stars will be created here using JavaScript -->
      <div id="starfield"></div>

      <!-- Selected star details -->
      <div id="starDetails" hidden>
        <button id="closeDetailsBtn" aria-label="Close star details">×</button>

        <h3>A Stranger's Star</h3>

        <p id="selectedThought"></p>

        <span id="selectedEmotion"></span>
      </div>

      <p id="skyMessage" role="status"></p>
    </section>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
